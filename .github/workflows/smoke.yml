name: UI smoke test

# Launches the real app on a macOS runner, simulates Spotify track changes and
# captures screenshots of every scene (see the "smoke-screens" artifact).
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild -project Vinyl.xcodeproj -scheme Vinyl -configuration Debug \
            -derivedDataPath build -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY=- build 2>&1 | tail -5

      - name: Compile helpers
        run: |
          swiftc -O tools/ci/post-spotify.swift -o post-spotify
          swiftc -O tools/ci/mouse.swift -o mouse

      - name: Run scenes
        run: |
          APP=build/Build/Products/Debug/Vinyl.app/Contents/MacOS/Vinyl
          ID=io.github.cyclonedraco.vinyl
          mkdir -p shots
          run_scene() {
            name=$1; scene=$2; first=$3; extra=$4
            defaults delete $ID >/dev/null 2>&1 || true
            defaults write $ID scene -string "$scene"
            defaults write $ID hasLaunchedBefore -bool "$first"
            if [ -n "$extra" ]; then eval "$extra"; fi
            VINYL_SNAPSHOT_DIR="$PWD/shots/$name" VINYL_SNAPSHOT_DELAY=16 "$APP" > "shots/$name.stdout.log" 2>&1 &
            pid=$!
            sleep 5
            ./post-spotify 0VjIjW4GlUZAMYd2vXMi3b "Blinding Lights" "The Weeknd" "After Hours"
            sleep 3
            ./post-spotify 3n3Ppam7vgaVa1iaRUc9Lp "Mr. Brightside" "The Killers" "Hot Fuss"
            sleep 3
            ./post-spotify 2Fxmhks0bxGSBdJ92vM42m "bad guy" "Billie Eilish" "WHEN WE ALL FALL ASLEEP, WHERE DO WE GO?" Playing 90
            sleep 8
            screencapture -x "shots/$name-screen.png" || true
            kill $pid || true
            sleep 1
          }
          run_scene listening-room listening-room true ""
          run_scene after-hours after-hours true "defaults write $ID sceneSizes -dict after-hours 0.5"
          run_scene turntable turntable true ""
          run_scene transparent listening-room true "defaults write $ID showBackground -bool false"
          run_scene mini mini false ""
          run_scene mini-record mini true "defaults write $ID miniStyle -string record; defaults write $ID miniHeight -float 180"
          run_scene turntable-large turntable true "defaults write $ID sceneSizes -dict turntable 1"

          # Mini player interaction: hover shows the controls, a click on the
          # record pauses it. The panel sits bottom-right of the main display.
          defaults delete $ID >/dev/null 2>&1 || true
          defaults write $ID scene -string mini
          defaults write $ID hasLaunchedBefore -bool true
          "$APP" > shots/mini-interaction.stdout.log 2>&1 &
          pid=$!
          sleep 5
          ./post-spotify 3n3Ppam7vgaVa1iaRUc9Lp "Mr. Brightside" "The Killers" "Hot Fuss"
          sleep 6
          ./mouse move 200 200
          sleep 1
          screencapture -x shots/mini-idle.png
          # Screen size in points (screencapture writes 1 px per point here).
          W=$(sips -g pixelWidth shots/mini-idle.png | awk '/pixelWidth/ {print $2}')
          H=$(sips -g pixelHeight shots/mini-idle.png | awk '/pixelHeight/ {print $2}')
          W=${W:-1024}; H=${H:-768}
          echo "display $W x $H"
          # Record centre, from the panel's default placement (see MiniPlayerController).
          python3 - "$W" "$H" > coords.txt <<'PY'
          import sys, subprocess
          w, h = float(sys.argv[1]), float(sys.argv[2])
          # Default: the turntable style, 280 pt tall, record centred vertically.
          ph = 280; pw = round(ph * 0.51 / 0.45)
          print(round(w - 32 - pw + pw * 0.215 / 0.51), round(h - 32 - 80 - ph / 2))
          PY
          read MX MY < coords.txt
          echo "record at $MX,$MY"
          ./mouse move $MX $MY
          sleep 1.5
          screencapture -x shots/mini-hover.png
          ./mouse click $MX $MY
          sleep 3
          screencapture -x shots/mini-clicked.png
          kill $pid || true
          ls -R shots

      - name: Collect logs
        if: always()
        run: |
          log show --last 10m --style compact --predicate 'subsystem == "io.github.cyclonedraco.vinyl" OR process == "Vinyl"' > shots/system.log 2>&1 || true
          echo "--- Vinyl's own log lines ---"
          grep -E "io.github.cyclonedraco.vinyl" shots/system.log | grep -vE "CFPrefs|xpc" | tail -40 || true
          grep -q "mini player record clicked" shots/system.log && echo "✅ mini player click received" || echo "⚠️ mini player click not seen in logs"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-screens
          path: shots/
